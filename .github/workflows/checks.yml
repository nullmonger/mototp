name: Checks

# Reusable gate: fmt, clippy and tests on the dev toolchain from rust-toolchain.toml.
# Deleting that file silently falls back to the Rust bundled in rust-dx-container.
# Both CI and the release flow call this gate,
# so a tag cannot ship a commit that never passed the checks.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    # TODO: bump the container tag together with dioxus upgrades;
    # dx and the crate must stay in step. Consider pinning the image by digest.
    container: ghcr.io/nerjs/rust-dx-container:1.2.0
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      # rsx! bodies are invisible to rustfmt; dx ships the formatter for them.
      - run: dx fmt --check

  clippy:
    runs-on: ubuntu-latest
    container: ghcr.io/nerjs/rust-dx-container:1.2.0
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    container: ghcr.io/nerjs/rust-dx-container:1.2.0
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
