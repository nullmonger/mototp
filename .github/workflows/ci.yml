name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    # TODO: bump-and-release runs checks.yml only,
    # so a tag can ship without this dx build; decide whether it belongs in the gate.
    container: ghcr.io/nerjs/rust-dx-container:1.2.0
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: dx build --release --platform desktop
